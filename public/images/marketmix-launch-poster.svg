    <path d="M20 43 46 21l26 22v30a4 4 0 0 1-4 4H24a4 4 0 0 1-4-4Z" fill="#102A22"/>
    <path d="M39 77V55h14v22M31 46h30" fill="none" stroke="#B8EED4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="112" y="61" fill="#F5FBF7" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="800" letter-spacing="-2">Market<tspan fill="#8AD5AA">Mix</tspan></text>
    <text x="115" y="88" fill="#B8D9C8" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="3">KENYA</text>
  </g>

  <text x="84" y="1180" fill="#B8D9C8" font-family="Arial, Helvetica, sans-serif" font-size="23">Shop local. Find home. Move forward.</text>
  <text x="84" y="1232" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" letter-spacing="3">SHOP LOCAL  ·  GROW LOCAL</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">MarketMix Kenya launch poster</title>
  <desc id="desc">Discover local homes, services, and businesses with MarketMix.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0C211B"/><stop offset="1" stop-color="#164A37"/></linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#D4F7E4"/><stop offset="1" stop-color="#57B783"/></linearGradient>
    <pattern id="dots" width="42" height="42" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="2" fill="#D4F7E4" opacity=".12"/></pattern>
  </defs>
  <rect width="1080" height="1350" fill="url(#bg)"/>
  <rect width="1080" height="1350" fill="url(#dots)"/>
  <circle cx="1000" cy="340" r="260" fill="#2A7555" opacity=".28"/>
  <circle cx="40" cy="1100" r="300" fill="#2A7555" opacity=".2"/>
  <g transform="translate(76 72)">

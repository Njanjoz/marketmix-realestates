  <text x="76" y="470" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="100" font-weight="800" letter-spacing="-5">Find what</text>
  <text x="76" y="580" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="100" font-weight="800" letter-spacing="-5">you need.</text>
  <text x="76" y="690" fill="#9DE0B8" font-family="Arial, Helvetica, sans-serif" font-size="100" font-weight="800" letter-spacing="-5">Grow local.</text>
  <text x="84" y="770" fill="#D9EAE1" font-family="Arial, Helvetica, sans-serif" font-size="30">Discover homes, services and local businesses</text>
  <text x="84" y="814" fill="#D9EAE1" font-family="Arial, Helvetica, sans-serif" font-size="30">all in one place.</text>
